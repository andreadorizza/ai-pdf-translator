[project]
name = "ai-pdf-translator"
version = "0.1.0"
description = "AI PDF translator for scanned documents in Lao and other low-resource languages: checked OCR, translation by your coding agent's subagents, English set in the original layout."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.13"
keywords = ["pdf-translator", "ocr", "lao", "translation", "agent-skills", "scanned-pdf"]
dependencies = [
    # PDFMathTranslate (pdf2zh): layout and write-back. Pinned: our runtime patches target this commit (docs/adr/0003).
    "pdf2zh @ git+https://github.com/PDFMathTranslate/PDFMathTranslate@86912e262d47361deceed97f0355ec6e3459b945",
    "pymupdf",
    "pillow",
    "laonlp",
    "requests",
    "sacrebleu",
    "wordninja",
    "rapidocr_onnxruntime",     # text detection in pictures (PaddleOCR's detector, Apache-2.0)
    "opencv-python-headless",   # inpainting under picture labels
]

[project.scripts]
ai-pdf-translator = "ai_pdf_translator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ai_pdf_translator"]

[tool.hatch.build.targets.wheel.force-include]
"skills/ai-pdf-translator" = "ai_pdf_translator/skill"
